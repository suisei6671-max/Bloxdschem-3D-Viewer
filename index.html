<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bloxd Schem Viewer</title>
<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#1d1f27;
font-family:sans-serif;
color:#fff
}
#app{
position:relative;
width:100%;
height:100%
}
#renderCanvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
image-rendering:pixelated
}
#ui{
position:absolute;
left:12px;
top:12px;
width:520px;
max-height:calc(100% - 24px);
overflow:auto;
background:rgba(0,0,0,.85);
border-radius:16px;
padding:14px;
z-index:10
}
button,input{
width:100%;
margin-bottom:10px
}
button{
border:none;
border-radius:10px;
padding:12px;
background:#4d78ff;
color:#fff;
font-weight:bold;
cursor:pointer
}
pre{
margin:0;
padding:10px;
background:#111;
border-radius:10px;
font-size:12px;
line-height:1.45;
white-space:pre-wrap;
word-break:break-word;
max-height:520px;
overflow:auto
}
</style>
</head>
<body>

<div id="app">

<canvas id="renderCanvas"></canvas>

<div id="ui">

<input type="file" id="schemInput" accept=".bloxdschem">

<button id="buildBtn">
Build Viewer
</button>

<pre id="log"></pre>

</div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

const logEl=document.getElementById("log");

function log(...args){

console.log(...args);

logEl.textContent+=args.map(v=>{

if(typeof v==="string"){
return v;
}

try{
return JSON.stringify(v,null,2);
}catch{
return String(v);
}

}).join(" ")+"\n";

logEl.scrollTop=logEl.scrollHeight;

}

log("[BOOT]");

const canvas=document.getElementById("renderCanvas");

const engine=new BABYLON.Engine(
canvas,
true,
{
antialias:false,
preserveDrawingBuffer:true
}
);

const scene=new BABYLON.Scene(engine);

scene.clearColor=new BABYLON.Color4(
0.2,
0.2,
0.3,
1
);

scene.ambientColor=new BABYLON.Color3(
1,
1,
1
);

const camera=new BABYLON.ArcRotateCamera(
"cam",
-Math.PI/2,
1.2,
30,
new BABYLON.Vector3(0,0,0),
scene
);

camera.attachControl(canvas,true);

const light=new BABYLON.HemisphericLight(
"light",
new BABYLON.Vector3(0,1,0),
scene
);

light.intensity=2;

log("[BABYLON READY]");

const textureData={};
const textureCache=new Map();
const materialCache=new Map();

let blockData=[];

async function extractTextures(){

log("[TEXTURE] scanning");

const res=await fetch("./76njx.4.74e4a68f.chunk.js");

const source=await res.text();

log("[TEXTURE] source size",source.length);

const pngRegex=/"\.\/([^"]+?)\.png":(\d+)/g;
const dataRegex=/(\d+):[^\n]*?exports\s*=\s*"([^"]+)"/g;

const pngMap=new Map();
const base64Map=new Map();

let match;

while((match=pngRegex.exec(source))!==null){

pngMap.set(
match[1],
parseInt(match[2])
);

}

log("[TEXTURE] png refs",pngMap.size);

while((match=dataRegex.exec(source))!==null){

const id=parseInt(match[1]);

const data=match[2];

if(data.startsWith("data:image")){

base64Map.set(id,data);

}

}

log("[TEXTURE] base64 refs",base64Map.size);

pngMap.forEach((id,name)=>{

const data=base64Map.get(id);

if(data){

textureData[name]=data;

}

});

log("[TEXTURE DONE]",Object.keys(textureData).length);

}

async function loadBlockData(){

const res=await fetch("./blockData.json");

blockData=await res.json();

log("[BLOCK DATA]",blockData.length);

log("[BLOCK SAMPLE]",blockData.slice(0,5));

}

function getTexture(name){

if(textureCache.has(name)){
return textureCache.get(name);
}

const data=textureData[name];

if(!data){

log("[MISSING TEXTURE]",name);

return null;

}

log("[TEXTURE LOAD]",name);

const tex=new BABYLON.Texture(
data,
scene,
false,
false,
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

tex.updateSamplingMode(
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

textureCache.set(name,tex);

return tex;

}

function getMaterial(name){

if(materialCache.has(name)){
return materialCache.get(name);
}

log("[MATERIAL]",name);

const mat=new BABYLON.StandardMaterial(
name,
scene
);

mat.specularColor=BABYLON.Color3.Black();

mat.emissiveColor=new BABYLON.Color3(
1,
1,
1
);

mat.disableLighting=true;

const tex=getTexture(name);

if(tex){

mat.diffuseTexture=tex;

}

materialCache.set(name,mat);

return mat;

}

function clearWorld(){

const meshes=scene.meshes.slice();

for(const mesh of meshes){

mesh.dispose();

}

}

function readULEB128(bytes,state){

let result=0;
let shift=0;

while(true){

const byte=bytes[state.offset++];

result|=(byte&127)<<shift;

if((byte&128)===0){
break;
}

shift+=7;

}

return result;

}

function decodeChunkBlocks(bytes){

log("[RAW BYTES]",Array.from(bytes));

const result=new Uint16Array(32*32*32);

const state={
offset:0
};

let placed=0;

while(state.offset<bytes.length){

const index=readULEB128(bytes,state);

if(state.offset>=bytes.length){
break;
}

const blockId=readULEB128(bytes,state);

if(index>=result.length){

log(
"[INDEX OOB]",
index,
blockId
);

continue;

}

result[index]=blockId;

placed++;

log(
"[BLOCK]",
placed,
"index=",
index,
"id=",
blockId
);

}

const unique=[...new Set(result)]
.filter(v=>v!==0);

log("[UNIQUE IDS]",unique);

return result;

}

function indexToXYZ(index){

const x=index%32;

const y=Math.floor(index/32)%32;

const z=Math.floor(index/(32*32));

return{
x,
y,
z
};

}

async function loadSchem(file){

log("[SCHEM] reading",file.name);

const buffer=await file.arrayBuffer();

const bytes=new Uint8Array(buffer);

log("[SCHEM] bytes",bytes.length);

let offset=4;

function readVarInt(){

let shift=0;
let result=0;

while(true){

const b=bytes[offset++];

result|=(b&127)<<shift;

if(!(b&128)){
break;
}

shift+=7;

}

return(result>>>1)^-(result&1);

}

function readString(){

const len=readVarInt();

const slice=bytes.slice(
offset,
offset+len
);

offset+=len;

return new TextDecoder().decode(slice);

}

function readBytes(){

const len=readVarInt();

const slice=bytes.slice(
offset,
offset+len
);

offset+=len;

return slice;

}

const schem={};

schem.name=readString();

schem.x=readVarInt();
schem.y=readVarInt();
schem.z=readVarInt();

schem.sizeX=readVarInt();
schem.sizeY=readVarInt();
schem.sizeZ=readVarInt();

log("[SCHEM HEADER]",schem);

schem.chunks=[];

while(offset<bytes.length){

const chunkCount=readVarInt();

log("[CHUNK COUNT]",chunkCount);

if(chunkCount<=0){
break;
}

for(let i=0;i<chunkCount;i++){

const chunk={};

chunk.x=readVarInt();
chunk.y=readVarInt();
chunk.z=readVarInt();

chunk.blocks=readBytes();

schem.chunks.push(chunk);

log(
"[CHUNK]",
chunk.x,
chunk.y,
chunk.z,
chunk.blocks.length
);

}

}

return schem;

}

function buildSchem(schem){

clearWorld();

log("[BUILD START]");

let rendered=0;

for(const chunk of schem.chunks){

const decoded=decodeChunkBlocks(
new Uint8Array(chunk.blocks)
);

log(
"[NONZERO COUNT]",
decoded.filter(v=>v!==0).length
);

for(let i=0;i<decoded.length;i++){

const id=decoded[i];

if(id===0){
continue;
}

const block=blockData[id];

log(
"[ID CHECK]",
id,
block?.name
);

if(!block){

log("[UNKNOWN BLOCK]",id);

continue;

}

const pos=indexToXYZ(i);

const worldX=chunk.x*32+pos.x;
const worldY=chunk.y*32+pos.y;
const worldZ=chunk.z*32+pos.z;

log(
"[PLACE]",
block.name,
worldX,
worldY,
worldZ
);

const box=BABYLON.MeshBuilder.CreateBox(
"block",
{
size:1
},
scene
);

box.position.set(
worldX,
worldY,
worldZ
);

let texName=null;

if(typeof block.textureInfo==="string"){

texName=block.textureInfo;

}else if(Array.isArray(block.textureInfo)){

texName=block.textureInfo[0];

}

if(texName){

box.material=getMaterial(texName);

}else{

const debugMat=
new BABYLON.StandardMaterial(
"debug",
scene
);

debugMat.diffuseColor=
new BABYLON.Color3(
1,
0,
1
);

box.material=debugMat;

}

rendered++;

}

}

log("[DONE]",rendered);

log(
"[MESH COUNT]",
scene.meshes.length
);

if(scene.meshes.length){

let minX=Infinity;
let minY=Infinity;
let minZ=Infinity;

let maxX=-Infinity;
let maxY=-Infinity;
let maxZ=-Infinity;

for(const mesh of scene.meshes){

minX=Math.min(minX,mesh.position.x);
minY=Math.min(minY,mesh.position.y);
minZ=Math.min(minZ,mesh.position.z);

maxX=Math.max(maxX,mesh.position.x);
maxY=Math.max(maxY,mesh.position.y);
maxZ=Math.max(maxZ,mesh.position.z);

log(
"[MESH]",
mesh.name,
mesh.position.x,
mesh.position.y,
mesh.position.z
);

}

const center=new BABYLON.Vector3(
(minX+maxX)/2,
(minY+maxY)/2,
(minZ+maxZ)/2
);

const size=Math.max(
maxX-minX,
maxY-minY,
maxZ-minZ
);

camera.target=center;

camera.radius=Math.max(
8,
size*2
);

log("[CAMERA]",center,size);

}

}

document.getElementById(
"buildBtn"
).onclick=async()=>{

try{

log("====================");

await extractTextures();

await loadBlockData();

const file=
document.getElementById(
"schemInput"
).files[0];

if(!file){

alert("schem選んで！");
return;

}

const schem=
await loadSchem(file);

buildSchem(schem);

}catch(err){

console.error(err);

log("[ERROR]",err.message);

}

};

engine.runRenderLoop(()=>{

scene.render();

});

window.addEventListener(
"resize",
()=>engine.resize()
);

log("[READY]");

</script>

</body>
</html>
