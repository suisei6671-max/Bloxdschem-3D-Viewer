<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bloxd Viewer</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#1d1f27;
font-family:sans-serif;
color:white;
}
#renderCanvas{
width:100%;
height:100%;
display:block;
image-rendering:pixelated;
}
#ui{
position:fixed;
left:10px;
top:10px;
width:520px;
max-height:95vh;
overflow:auto;
background:rgba(0,0,0,.88);
padding:14px;
border-radius:14px;
z-index:10;
}
button,input{
width:100%;
margin-bottom:10px;
}
button{
border:none;
padding:12px;
border-radius:10px;
background:#4d78ff;
color:white;
font-weight:bold;
cursor:pointer;
}
pre{
margin:0;
padding:10px;
background:#111;
border-radius:10px;
font-size:12px;
white-space:pre-wrap;
word-break:break-word;
max-height:420px;
overflow:auto;
}
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="ui">

<div style="font-size:24px;font-weight:bold;margin-bottom:8px">
Bloxd Viewer
</div>

<div style="opacity:.7;margin-bottom:12px">
FIX: all non-side faces rotated right 90°
</div>

<input type="file" id="schemInput" accept=".bloxdschem">

<button id="buildBtn">
BUILD
</button>

<pre id="log"></pre>

</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

const logEl=document.getElementById("log");

function log(...a){
console.log(...a);
logEl.textContent+=a.join(" ")+"\n";
logEl.scrollTop=logEl.scrollHeight;
}

const canvas=document.getElementById("renderCanvas");

const engine=new BABYLON.Engine(canvas,true,{
antialias:false,
preserveDrawingBuffer:true
});

const scene=new BABYLON.Scene(engine);

scene.clearColor=new BABYLON.Color4(.2,.2,.3,1);

const camera=new BABYLON.ArcRotateCamera(
"cam",
-Math.PI/2,
1.2,
30,
new BABYLON.Vector3(0,0,0),
scene
);

camera.attachControl(canvas,true);

const light=new BABYLON.HemisphericLight(
"light",
new BABYLON.Vector3(0,1,0),
scene
);

light.intensity=2;

const textureData={};
const textureCache=new Map();
const materialCache=new Map();

let blockMap={};

async function extractTextures(){

log("[TEXTURE]");

const res=await fetch("./76njx.4.74e4a68f.chunk.js");

const src=await res.text();

const pngRegex=/"\.\/([^"]+?)\.png":(\d+)/g;
const dataRegex=/(\d+):[^\n]*?exports\s*=\s*"([^"]+)"/g;

const pngMap=new Map();
const base64Map=new Map();

let m;

while((m=pngRegex.exec(src))!==null){

pngMap.set(
m[1],
parseInt(m[2])
);

}

while((m=dataRegex.exec(src))!==null){

const id=parseInt(m[1]);

const data=m[2];

if(data.startsWith("data:image")){

base64Map.set(id,data);

}

}

pngMap.forEach((id,name)=>{

const data=base64Map.get(id);

if(data){

textureData[name]=data;

}

});

log("[TEXTURES]",Object.keys(textureData).length);

}

async function loadBlockData(){

const res=await fetch("./blockData.json");

const json=await res.json();

blockMap={};

for(const entry of json){

blockMap[
parseInt(entry[0])
]=entry[1];

}

log("[BLOCKS]",Object.keys(blockMap).length);

}

function getTexture(name){

if(textureCache.has(name)){

return textureCache.get(name);

}

const data=textureData[name];

if(!data){

log("[MISSING]",name);
return null;
}

const tex=new BABYLON.Texture(
data,
scene,
false,
false,
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

tex.updateSamplingMode(
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

textureCache.set(name,tex);

return tex;

}

async function createRotatedTexture(name,deg){

const key=name+"_r"+deg;

if(textureCache.has(key)){

return textureCache.get(key);

}

const src=textureData[name];

if(!src){

return getTexture(name);

}

return new Promise(resolve=>{

const img=new Image();

img.src=src;

img.onload=()=>{

const c=document.createElement("canvas");

c.width=16;
c.height=16;

const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

ctx.translate(8,8);

ctx.rotate(deg*Math.PI/180);

ctx.drawImage(img,-8,-8,16,16);

const tex=new BABYLON.DynamicTexture(
key,
{
width:16,
height:16
},
scene,
false,
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

const tctx=tex.getContext();

tctx.imageSmoothingEnabled=false;

tctx.drawImage(c,0,0);

tex.update();

tex.updateSamplingMode(
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

textureCache.set(key,tex);

resolve(tex);

};

});

}

async function createFaceMaterial(texName,rot){

const key=texName+"_mat_"+rot;

if(materialCache.has(key)){

return materialCache.get(key);

}

let tex;

if(rot!==0){

tex=await createRotatedTexture(texName,rot);

}else{

tex=getTexture(texName);

}

const mat=new BABYLON.StandardMaterial(
key,
scene
);

mat.diffuseTexture=tex;

mat.specularColor=BABYLON.Color3.Black();

mat.emissiveColor=new BABYLON.Color3(1,1,1);

mat.disableLighting=true;

materialCache.set(key,mat);

return mat;

}

function clearScene(){

scene.meshes.slice().forEach(m=>m.dispose());

}

function readULEB(bytes,state){

let result=0;
let shift=0;

while(true){

const byte=bytes[state.offset++];

result|=(byte&127)<<shift;

if((byte&128)===0)break;

shift+=7;

}

return result;

}

function decodeBlocks(bytes){

const arr=new Uint16Array(32*32*32);

const state={offset:0};

while(state.offset<bytes.length){

const index=readULEB(bytes,state);

if(state.offset>=bytes.length)break;

const id=readULEB(bytes,state);

if(index<arr.length){

arr[index]=id;

}

}

return arr;

}

function idxToXYZ(i){

return{
x:i%32,
y:Math.floor(i/32)%32,
z:Math.floor(i/1024)
};

}

async function parseSchem(file){

const buf=await file.arrayBuffer();

const bytes=new Uint8Array(buf);

let offset=4;

function readVarInt(){

let shift=0;
let result=0;

while(true){

const b=bytes[offset++];

result|=(b&127)<<shift;

if(!(b&128))break;

shift+=7;

}

return(result>>>1)^-(result&1);

}

function readString(){

const len=readVarInt();

const slice=bytes.slice(offset,offset+len);

offset+=len;

return new TextDecoder().decode(slice);

}

function readBytes(){

const len=readVarInt();

const slice=bytes.slice(offset,offset+len);

offset+=len;

return slice;

}

const schem={};

schem.name=readString();

schem.x=readVarInt();
schem.y=readVarInt();
schem.z=readVarInt();

schem.sizeX=readVarInt();
schem.sizeY=readVarInt();
schem.sizeZ=readVarInt();

schem.chunks=[];

while(offset<bytes.length){

const count=readVarInt();

if(count<=0)break;

for(let i=0;i<count;i++){

schem.chunks.push({
x:readVarInt(),
y:readVarInt(),
z:readVarInt(),
blocks:readBytes()
});

}

}

return schem;

}

async function buildBlock(block,x,y,z){

const mesh=BABYLON.MeshBuilder.CreateBox(
"b",
{size:1},
scene
);

mesh.position.set(x,y,z);

if(typeof block.textureInfo==="string"){

const mat=await createFaceMaterial(
block.textureInfo,
0
);

mesh.material=mat;

return;

}

const multi=new BABYLON.MultiMaterial(
"multi",
scene
);

/*
Babylon:
0 front
1 back
2 right
3 left
4 top
5 bottom

Bloxd:
[left,right,top,bottom,front,back]
*/

const faceMap=[
4,
5,
1,
0,
2,
3
];

/*
ユーザー修正:
top/bottom/front/back
を右90°
left/rightはそのまま
*/

const rotationMap={
0:90,
1:90,
2:0,
3:0,
4:90,
5:90
};

for(let face=0;face<6;face++){

const bloxdFace=faceMap[face];

const texIndex=
block.texturePerSide?.[
bloxdFace
] ?? 0;

const texName=
block.textureInfo[
texIndex
];

const rot=
rotationMap[face] ?? 0;

log(
"[FACE]",
face,
texName,
"ROT",
rot
);

const mat=
await createFaceMaterial(
texName,
rot
);

multi.subMaterials.push(mat);

}

mesh.material=multi;

const vc=mesh.getTotalVertices();

mesh.subMeshes=[];

let idx=0;

for(let i=0;i<6;i++){

mesh.subMeshes.push(
new BABYLON.SubMesh(
i,
0,
vc,
idx,
6,
mesh
)
);

idx+=6;

}

}

async function buildSchem(schem){

clearScene();

let count=0;

for(const chunk of schem.chunks){

const decoded=decodeBlocks(
new Uint8Array(chunk.blocks)
);

for(let i=0;i<decoded.length;i++){

let id=decoded[i];

if(id===0)continue;

id=id-1;

const block=blockMap[id];

if(!block)continue;

const pos=idxToXYZ(i);

await buildBlock(
block,
chunk.x*32+pos.x,
chunk.y*32+pos.y,
chunk.z*32+pos.z
);

count++;

}

}

log("[DONE]",count);

}

document.getElementById("buildBtn").onclick=async()=>{

try{

await extractTextures();

await loadBlockData();

const file=
document.getElementById("schemInput").files[0];

if(!file){

alert("schem選択！");
return;
}

const schem=await parseSchem(file);

log("[SCHEM]",schem.name);

await buildSchem(schem);

}catch(e){

console.error(e);

log("[ERROR]",e.message);

}

};

engine.runRenderLoop(()=>{

scene.render();

});

window.addEventListener(
"resize",
()=>engine.resize()
);

log("[READY]");

</script>

</body>
</html>
