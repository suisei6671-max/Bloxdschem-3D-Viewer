<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script>
// ===============================
const EC = function(id) {
    if (!EC.m[id]) {
        console.warn("❌ missing module:", id);
        EC.missing.add(id);
        return {};
    }

    if (EC.c[id]) return EC.c[id].exports;

    const module = { exports: {} };
    EC.c[id] = module;

    try {
        EC.m[id](module, module.exports, EC);
    } catch (e) {
        console.warn("⚠ 実行エラー:", id, e);
    }

    return module.exports;
};

EC.m = {};
EC.c = {};
EC.missing = new Set();

window.EC = EC;

// ===============================
EC.d = (obj, defs) => {
    for (const key in defs) {
        Object.defineProperty(obj, key, {
            enumerable: true,
            get: defs[key]
        });
    }
};

EC.r = (obj) => {
    Object.defineProperty(obj, "__esModule", { value: true });
};

EC.o = (obj, prop) => Object.prototype.hasOwnProperty.call(obj, prop);

// ===============================
async function loadChunk(path) {
    console.log("📦 loading:", path);

    const text = await fetch(path).then(r => r.text());

    // 🔥 modules の位置を正確に探す
    const match = text.match(/modules\s*=\s*\{/);

    if (!match) {
        console.error("❌ modules not found");
        return;
    }

    const braceStart = match.index + match[0].length - 1;

    let depth = 0;
    let end = braceStart;

    for (let i = braceStart; i < text.length; i++) {
        if (text[i] === "{") depth++;
        if (text[i] === "}") depth--;

        if (depth === 0) {
            end = i;
            break;
        }
    }

    const objText = text.slice(braceStart, end + 1);

    console.log("🧪 preview:", objText.slice(0, 120));

    let modules;
    try {
        modules = new Function("return " + objText)();
    } catch (e) {
        console.error("❌ parse failed:", e);
        return;
    }

    Object.assign(EC.m, modules);

    console.log("✅ loaded:", Object.keys(modules).length);
}

// ===============================
(async () => {

    console.log("=== STABLE LOAD ===");

    await loadChunk("./bloxd_chunk4.js");
    await loadChunk("./bloxd_chunk5.js");

    console.log("🎯 TOTAL:", Object.keys(EC.m).length);

    EC(1929);

    console.log("🔥 missing:", [...EC.missing]);

})();
</script>
</body>
</html>
