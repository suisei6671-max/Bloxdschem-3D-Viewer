<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader</title>
</head>
<body>

<h2>bloxd chunk test</h2>

<script>
const EC = function(id) {
    if (!EC.m[id]) {
        throw new Error("Module " + id + " not found");
    }
    if (EC.c[id]) return EC.c[id].exports;

    const module = { exports: {} };
    EC.c[id] = module;

    EC.m[id](module, module.exports, EC);

    return module.exports;
};

EC.m = {};
EC.c = {};
window.EC = EC;
</script>

<script type="module">
import * as chunk5 from "./bloxd_source.js";

Object.assign(EC.m, chunk5.modules);

console.log("modules:", Object.keys(chunk5.modules));

// テスト実行
const first = Object.keys(chunk5.modules)[0];
console.log("run:", first);
console.log(EC(first));

</script>

</body>
</html>
