<h2>bloxd chunk loader</h2>

<script>
// ===== webpackランタイム再現 =====
const EC = function(id) {
    if (!EC.m[id]) {
        console.warn("Module missing:", id);
        return {};
    }
    if (EC.c[id]) return EC.c[id].exports;

    const module = { exports: {} };
    EC.c[id] = module;

    try {
        EC.m[id].call(module.exports, module, module.exports, EC);
    } catch (e) {
        console.error("Error in module:", id, e);
    }

    return module.exports;
};

EC.m = {};
EC.c = {};

// --- webpack helper群 ---
EC.d = (exports, name, getter) => {
    if (!EC.o(exports, name)) {
        Object.defineProperty(exports, name, {
            enumerable: true,
            get: getter
        });
    }
};

EC.r = (exports) => {
    if (typeof Symbol !== "undefined" && Symbol.toStringTag) {
        Object.defineProperty(exports, Symbol.toStringTag, { value: "Module" });
    }
    Object.defineProperty(exports, "__esModule", { value: true });
};

EC.o = (obj, prop) => Object.prototype.hasOwnProperty.call(obj, prop);

EC.n = (module) => {
    const getter = module && module.__esModule
        ? () => module.default
        : () => module;
    EC.d(getter, "a", getter);
    return getter;
};

EC.t = (value, mode) => {
    if (mode & 1) value = EC(value);
    if (mode & 8) return value;
    if ((mode & 4) && typeof value === "object" && value && value.__esModule) return value;

    const ns = Object.create(null);
    EC.r(ns);

    Object.defineProperty(ns, "default", {
        enumerable: true,
        value: value
    });

    if (mode & 2 && typeof value != "string") {
        for (let key in value) {
            EC.d(ns, key, ((k) => value[k]).bind(null, key));
        }
    }

    return ns;
};

// chunk loader（簡易）
EC.e = async (chunkId) => {
    console.log("load chunk", chunkId);
    const mod = await import(`./bloxd_chunk${chunkId}.js`);
    Object.assign(EC.m, mod.modules);
    console.log("loaded chunk", chunkId);
};

window.EC = EC;
</script>

<script type="module">
(async () => {

    // ===== chunkロード =====
    await EC.e(4);
    await EC.e(5);

    console.log("all modules:", Object.keys(EC.m));

    // ===== テスト実行 =====
    const ids = Object.keys(EC.m);

    for (let i = 0; i < 5; i++) {
        const id = ids[i];
        console.log("run test module:", id);
        try {
            console.log(EC(id));
        } catch (e) {
            console.warn("fail:", id);
        }
    }

})();
</script>
