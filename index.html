<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script>
// ===============================
// webpackフック
// ===============================
window.webpackChunk = window.webpackChunk || [];

const realPush = window.webpackChunk.push.bind(window.webpackChunk);

window.webpackChunk.push = function(data) {
    console.log("📦 chunk pushed:", data);

    const modules = data[1];

    Object.assign(EC.m, modules);

    console.log("✅ modules追加:", Object.keys(modules).length);

    return realPush(data);
};

// ===============================
// require再現
// ===============================
const EC = function(id) {
    if (!EC.m[id]) {
        console.warn("❌ missing:", id);
        EC.missing.add(id);
        return {};
    }

    if (EC.c[id]) return EC.c[id].exports;

    const module = { exports: {} };
    EC.c[id] = module;

    try {
        EC.m[id](module, module.exports, EC);
    } catch (e) {
        console.warn("⚠ 実行エラー:", id, e);
    }

    return module.exports;
};

EC.m = {};
EC.c = {};
EC.missing = new Set();

window.EC = EC;

// ===============================
// chunk読み込み（そのままscriptとして）
// ===============================
function loadScript(src) {
    return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.body.appendChild(s);
    });
}

// ===============================
(async () => {

    console.log("=== WEBPACK MODE ===");

    // 👇 ここ超重要（JSとして読み込む）
    await loadScript("./bloxd_chunk4.js");
    await loadScript("./bloxd_chunk5.js");

    console.log("🎯 TOTAL:", Object.keys(EC.m).length);

    // 実行
    const mod = EC(1929);

    console.log("📦 1929:", mod);

    console.log("🔥 missing:", [...EC.missing]);

})();
</script>
</body>
</html>
