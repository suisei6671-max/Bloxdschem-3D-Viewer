<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Bloxd Schem Viewer - Optimized</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1d24;
            font-family: sans-serif;
            color: white;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        #ui {
            position: fixed;
            left: 10px;
            top: 10px;
            width: 420px;
            max-height: 95vh;
            overflow: auto;
            background: rgba(0, 0, 0, .88);
            padding: 14px;
            border-radius: 14px;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .ver {
            font-size: 13px;
            opacity: .7;
            margin-bottom: 12px;
        }

        button, input {
            width: 100%;
            margin-bottom: 10px;
        }

        button {
            border: none;
            background: #4d7cff;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6690ff;
        }

        pre {
            background: #111;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 420px;
            overflow: auto;
        }
    </style>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <div id="ui">
        <div class="title">Bloxd Schem Viewer</div>
        <div class="ver">ver alpha-0.15-optimized</div>
        
        <input type="file" id="schemInput" accept=".bloxdschem">
        <button id="buildBtn">BUILD</button>
        <button id="captureBtn" onclick="window.instantCapture()" style="background: #4CAF50; margin-top: 10px;">CAPTURE (Zero Margin)</button>
        
        <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
            <label for="marginSlider" style="color: white; font-size: 12px;">Margin:</label>
            <input type="range" id="marginSlider" min="0" max="100" value="30" style="flex: 1;">
            <span id="marginValue" style="color: white; font-size: 12px; min-width: 30px;">30%</span>
        </div>

        <pre id="log"></pre>
    </div>

    <!-- Babylon.js Library -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    
    <!-- Main Logic -->
    <script src="./bloxdschemviewer.js" type="module"></script>

</body>
</html>
