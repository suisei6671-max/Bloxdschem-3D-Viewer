<!DOCTYPE html>

<body>

<h2>bloxd chunk loader (stable)</h2>
<script type="module">

async function loadChunk(path) {
    const mod = await import(path);
    return mod.modules;
}

(async () => {

    console.log("=== FINAL STEP ===");

    // 🔥 両方読み込む
    const modules = {
        ...(await loadChunk("./bloxd_chunk4.js")),
        ...(await loadChunk("./bloxd_chunk5.js"))
    };

    console.log("🎯 modules:", Object.keys(modules).length);

    const cache = {};

    function EC(id) {
        if (!modules[id]) {
            console.warn("❌ missing:", id);
            return {};
        }

        if (cache[id]) return cache[id].exports;

        const module = { exports: {} };
        cache[id] = module;

        modules[id](module, module.exports, EC);

        return module.exports;
    }

    EC.d = (exports, def) => {
        for (const k in def) {
            Object.defineProperty(exports, k, {
                enumerable: true,
                get: def[k]
            });
        }
    };

    EC.o = (obj, prop) => Object.prototype.hasOwnProperty.call(obj, prop);
    EC.r = (exports) => Object.defineProperty(exports, '__esModule', { value: true });

    // ===============================
    // 🔥 本命
    // ===============================
    const mod1911 = EC(1911);

    console.log("📦 1911:", mod1911);

    // 🎯 blockMetadata
    console.log("🎯 blockMetadata:", mod1911.blockMetadata);

})();
</script>
