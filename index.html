<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script>
// ===============================
const EC = { m: {} };
window.EC = EC;

// ===============================
async function loadChunk(path) {
    console.log("📦 loading:", path);

    const text = await fetch(path).then(r => r.text());

    // ===============================
    // 🔥 modulesオブジェクトを“文字列として抽出”
    // ===============================
    const match = text.match(/modules\s*=\s*({[\s\S]*?})[,;\n]/);

    if (!match) {
        console.error("❌ modules not found");
        return;
    }

    let modules;

    try {
        modules = eval("(" + match[1] + ")");
    } catch (e) {
        console.error("❌ eval failed:", e);
        return;
    }

    Object.assign(EC.m, modules);

    console.log("✅ loaded:", Object.keys(modules).length);
}

// ===============================
(async () => {

    console.log("=== SAFE LOAD ===");

    await loadChunk("./bloxd_chunk4.js");
    await loadChunk("./bloxd_chunk5.js");

    console.log("🎯 TOTAL:", Object.keys(EC.m).length);

})();
</script>
</body>
</html>
