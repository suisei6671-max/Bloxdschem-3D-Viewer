<h2>bloxd chunk loader (stable)</h2>
<script type="module">

async function loadChunk(path) {
    console.log("📦 loading:", path);
    const mod = await import(path);
    return mod.modules;
}

(async () => {

    console.log("=== FULL WEBPACK EMULATION ===");

    const modules = await loadChunk("./bloxd_chunk5.js");

    console.log("🎯 modules:", Object.keys(modules).length);

    const cache = {};

    function EC(id) {
        if (!modules[id]) {
            console.warn("❌ missing:", id);
            return {};
        }

        if (cache[id]) return cache[id].exports;

        const module = { exports: {} };
        cache[id] = module;

        modules[id](module, module.exports, EC);

        return module.exports;
    }

    // ===============================
    // 🔥 ここが超重要（不足してたやつ）
    // ===============================

    EC.d = function(exports, definition) {
        for (const key in definition) {
            if (!EC.o(exports, key)) {
                Object.defineProperty(exports, key, {
                    enumerable: true,
                    get: definition[key]
                });
            }
        }
    };

    EC.o = function(obj, prop) {
        return Object.prototype.hasOwnProperty.call(obj, prop);
    };

    EC.r = function(exports) {
        Object.defineProperty(exports, '__esModule', { value: true });
    };

    // ===============================

    const mod1929 = EC(1929);

    console.log("📦 1929:", mod1929);

})();
</script>
