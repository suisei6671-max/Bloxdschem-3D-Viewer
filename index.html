<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script>
// ===============================
const EC = { m: {} };
window.EC = EC;

// ===============================
async function loadChunk(path) {
    console.log("📦 loading:", path);

    const text = await fetch(path).then(r => r.text());

    const start = text.indexOf("export const modules");
    if (start === -1) {
        console.error("❌ modules not found");
        return;
    }

    const braceStart = text.indexOf("{", start);
    let depth = 0;
    let end = braceStart;

    for (let i = braceStart; i < text.length; i++) {
        if (text[i] === "{") depth++;
        if (text[i] === "}") depth--;

        if (depth === 0) {
            end = i;
            break;
        }
    }

    const objText = text.slice(braceStart, end + 1);

    let modules;
    try {
        modules = new Function("return " + objText)();
    } catch (e) {
        console.error("❌ parse failed:", e);
        return;
    }

    Object.assign(EC.m, modules);

    console.log("✅ loaded:", Object.keys(modules).length);
}

// ===============================
function runModule(id) {
    if (typeof EC.m[id] !== "function") {
        console.warn("❌ not function:", id);
        return null;
    }

    const module = { exports: {} };

    const fakeEC = {
        d: (obj, defs) => {
            for (const key in defs) {
                Object.defineProperty(obj, key, {
                    enumerable: true,
                    get: defs[key]
                });
            }
        },
        r: (obj) => {
            Object.defineProperty(obj, "__esModule", { value: true });
        }
    };

    try {
        EC.m[id](module, module.exports, fakeEC);
        return module.exports;
    } catch (e) {
        console.warn("⚠ 実行エラー:", id, e);
        return null;
    }
}

// ===============================
(async () => {

    console.log("=== START ===");

    await loadChunk("./bloxd_chunk4.js");
    await loadChunk("./bloxd_chunk5.js");

    console.log("🎯 TOTAL:", Object.keys(EC.m).length);

    // ===============================
    // 🔥 1929 実行
    // ===============================
    const mod = runModule(1929);

    console.log("📦 module 1929:", mod);

    if (!mod) {
        console.error("❌ 1929 failed");
        return;
    }

    // ===============================
    // 🔍 中身展開
    // ===============================
    const results = {};

    Object.keys(mod).forEach(k => {
        try {
            const v = mod[k];
            console.log("🔍", k, v);

            // 👇 blockっぽい特徴検出
            if (
                v &&
                typeof v === "object" &&
                (
                    "textureInfo" in v ||
                    "animTextures" in v ||
                    Object.keys(v).length > 50
                )
            ) {
                console.log("🔥 FOUND BLOCK CANDIDATE:", k);
                results[k] = v;
            }

        } catch (e) {
            console.log("⚠", k, "error");
        }
    });

    console.log("🎯 BLOCK候補まとめ:", results);

})();
</script>
</body>
</html>
