<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script>
// ===============================
// 最小webpack風コンテナ
// ===============================
const EC = {
    m: {}, // modules
    c: {}  // cache（今回は未使用）
};

window.EC = EC;

// ===============================
// chunkからmodulesだけ抽出
// ===============================
async function loadChunk(path) {
    console.log("📦 loading:", path);

    const text = await fetch(path).then(r => r.text());

    // ===== exportを削除して「return modules」に変換 =====
    const fixed = text
        .replace(/export const id = .*?;/, "")
        .replace(/export const ids = .*?;/, "")
        .replace(/export const modules =/, "return");

    let modules;

    try {
        modules = new Function(fixed)();
    } catch (e) {
        console.error("❌ parse failed:", path, e);
        return;
    }

    Object.assign(EC.m, modules);

    console.log("✅ loaded modules:", Object.keys(modules).length);
}

// ===============================
// メイン処理
// ===============================
(async () => {

    console.log("=== module extraction start ===");

    // 必要なchunkを読み込む
    await loadChunk("./bloxd_chunk4.js");
    await loadChunk("./bloxd_chunk5.js");

    const total = Object.keys(EC.m).length;

    console.log("🎯 TOTAL MODULES:", total);

    // ===============================
    // 確認用
    // ===============================
    if (total === 0) {
        console.warn("⚠ modulesが0 → chunk読み込み失敗");
        return;
    }

    // ===============================
    // デバッグ：最初の5個見る
    // ===============================
    const ids = Object.keys(EC.m).slice(0, 5);

    for (const id of ids) {
        console.log("▶ module:", id);
        console.log(EC.m[id].toString().slice(0, 200));
    }

    console.log("=== ready for analysis ===");

})();
</script>

</body>
</html>
