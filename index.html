<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bloxd Viewer Ultra Debug</title>
<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#1d1f27;
font-family:sans-serif;
color:#fff
}
#app{
position:relative;
width:100%;
height:100%
}
#noa-canvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
image-rendering:pixelated
}
#ui{
position:absolute;
left:12px;
top:12px;
width:520px;
max-height:calc(100% - 24px);
overflow:auto;
background:rgba(0,0,0,.82);
border-radius:16px;
padding:14px;
z-index:10;
backdrop-filter:blur(8px)
}
input,button{
width:100%;
margin-bottom:10px
}
button{
border:none;
border-radius:10px;
padding:12px;
background:#4d78ff;
color:#fff;
font-weight:bold;
cursor:pointer
}
pre{
margin:0;
padding:10px;
background:#111;
border-radius:10px;
font-size:12px;
line-height:1.45;
white-space:pre-wrap;
word-break:break-word;
max-height:500px;
overflow:auto
}
</style>
</head>
<body>

<div id="app">

<canvas id="noa-canvas"></canvas>

<div id="ui">

<input type="file" id="schemInput" accept=".bloxdschem">

<button id="buildBtn">
Build Viewer
</button>

<pre id="log"></pre>

</div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

function decodeChunkBlocks(bytes){

log("[RAW BYTES]",Array.from(bytes));

/*
Explosive の blocks:
[128,128,128,128,1,146,2,0,0,0]

今まで:
[count][id]

だったけど違う。

実際は:

first = position
second = block id

っぽい。
*/

const result=new Uint16Array(32*32*32);

let offset=0;

function readVarInt(){

let num=0;
let shift=0;

while(true){

const b=bytes[offset++];

num|=(b&127)<<shift;

if((b&128)===0){
break;
}

shift+=7;

}

return num;

}

let placed=0;

while(offset<bytes.length){

const index=readVarInt();

if(offset>=bytes.length){
break;
}

const blockId=readVarInt();

if(index>=result.length){

log(
"[INDEX OOB]",
index,
blockId
);

continue;

}

result[index]=blockId;

placed++;

log(
"[BLOCK]",
placed,
"index=",
index,
"id=",
blockId
);

}

const unique=[...new Set(result)].filter(v=>v!==0);

log("[UNIQUE IDS]",unique);

return result;

}

function indexToXYZ(index){

const x=index%32;

const y=Math.floor(index/32)%32;

const z=Math.floor(index/(32*32));

return{
x,
y,
z
};

}

function buildSchem(schem){

clearWorld();

log("[BUILD START]");

let rendered=0;

for(const chunk of schem.chunks){

const decoded=decodeChunkBlocks(
new Uint8Array(chunk.blocks)
);

log(
"[NONZERO COUNT]",
decoded.filter(v=>v!==0).length
);

for(let i=0;i<decoded.length;i++){

const id=decoded[i];

if(id===0){
continue;
}

const block=blockData[id];

log(
"[ID CHECK]",
id,
block?.name
);

if(!block){

log("[UNKNOWN BLOCK]",id);

continue;

}

const pos=indexToXYZ(i);

const worldX=chunk.x*32+pos.x;
const worldY=chunk.y*32+pos.y;
const worldZ=chunk.z*32+pos.z;

log(
"[PLACE]",
block.name,
worldX,
worldY,
worldZ
);

const box=BABYLON.MeshBuilder.CreateBox(
"block",
{
size:1
},
scene
);

box.position.set(
worldX,
worldY,
worldZ
);

let texName=null;

if(typeof block.textureInfo==="string"){

texName=block.textureInfo;

}else if(
Array.isArray(block.textureInfo)
){

texName=block.textureInfo[0];

}

if(texName){

box.material=getMaterial(texName);

}else{

const debugMat=
new BABYLON.StandardMaterial(
"debug",
scene
);

debugMat.diffuseColor=
new BABYLON.Color3(
1,
0,
1
);

box.material=debugMat;

}

rendered++;

}

}

log("[DONE]",rendered);

log(
"[MESH COUNT]",
scene.meshes.length
);

if(scene.meshes.length){

const meshes=scene.meshes;

let minX=Infinity;
let minY=Infinity;
let minZ=Infinity;

let maxX=-Infinity;
let maxY=-Infinity;
let maxZ=-Infinity;

for(const mesh of meshes){

minX=Math.min(minX,mesh.position.x);
minY=Math.min(minY,mesh.position.y);
minZ=Math.min(minZ,mesh.position.z);

maxX=Math.max(maxX,mesh.position.x);
maxY=Math.max(maxY,mesh.position.y);
maxZ=Math.max(maxZ,mesh.position.z);

}

const center=new BABYLON.Vector3(
(minX+maxX)/2,
(minY+maxY)/2,
(minZ+maxZ)/2
);

camera.target=center;

const size=Math.max(
maxX-minX,
maxY-minY,
maxZ-minZ
);

camera.radius=Math.max(8,size*2);

log("[CAMERA]",center,size);

}

}

</script>

</body>
</html>
