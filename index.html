<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bloxd Module Inspector</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #eee; padding: 20px; }
        #status { color: #ffca28; margin-bottom: 10px; }
        pre { background: #000; padding: 10px; overflow: auto; max-height: 400px; border: 1px solid #444; }
    </style>
</head>
<body>

<h1>Bloxd Module Inspector</h1>
<div id="status">準備中...</div>

<h3>モジュール一覧 (Consoleも確認してください)</h3>
<pre id="output">読み込みを待機中...</pre>

<script>
// 1. webpackフックの準備
window.capturedModules = {};
self.webpackChunk = self.webpackChunk || [];
const origPush = self.webpackChunk.push.bind(self.webpackChunk);

self.webpackChunk.push = function(chunk) {
    const modules = chunk[1];
    Object.assign(window.capturedModules, modules);
    document.getElementById('status').innerText = "チャンクを捕捉しました！";
    return origPush(chunk);
};

// 2. ターゲットURLとプロキシ
const targetUrl = "https://bloxd.io/static/js/rrdnom.5.f00d9975.chunk.js";
const proxy = "https://cors-anywhere.herokuapp.com/"; // 要アクセス許可

fetch(proxy + targetUrl)
    .then(res => {
        if (!res.ok) throw new Error("CORSプロキシへのアクセスが拒否されました");
        return res.text();
    })
    .then(code => {
        document.getElementById('status').innerText = "コード取得成功。実行中...";
        
        // exportを削除して実行可能にする
        const cleanCode = code.replace(/export\s+/g, "");
        
        // scriptタグとして挿入（evalより安全でデバッグしやすい）
        const script = document.createElement('script');
        script.textContent = cleanCode;
        document.body.appendChild(script);

        setTimeout(() => {
            const keys = Object.keys(window.capturedModules);
            document.getElementById('output').innerText = 
                `捕捉したモジュール数: ${keys.length}\nキー一覧:\n` + keys.join("\n");
            console.log("Captured Modules:", window.capturedModules);
        }, 1000);
    })
    .catch(err => {
        document.getElementById('status').innerText = "エラー: " + err.message;
        document.getElementById('output').innerText = "CORS Anywhereのデモページで許可を得ているか確認してください。";
    });
</script>
</body>
</html>
