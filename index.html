<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script>
// ===============================
// webpackランタイム（実行可能版）
// ===============================
const EC = function(id) {
    if (!EC.m[id]) {
        console.warn("Module missing:", id);
        return {};
    }

    if (EC.c[id]) return EC.c[id].exports;

    const module = { exports: {} };
    EC.c[id] = module;

    try {
        EC.m[id].call(module.exports, module, module.exports, EC);
    } catch (e) {
        console.warn("⚠ module error:", id, e);
    }

    return module.exports;
};

EC.m = {};
EC.c = {};

// helper（必要最低限）
EC.d = (exports, name, getter) => {
    Object.defineProperty(exports, name, { enumerable: true, get: getter });
};

EC.r = (exports) => {
    Object.defineProperty(exports, "__esModule", { value: true });
};

window.EC = EC;

// ===============================
// modules抽出（実行しない）
// ===============================
async function loadChunk(path) {
    const text = await fetch(path).then(r => r.text());

    const fixed = text
        .replace(/export const id = .*?;/, "")
        .replace(/export const ids = .*?;/, "")
        .replace(/export const modules =/, "return");

    const modules = new Function(fixed)();

    Object.assign(EC.m, modules);
}

// ===============================
// 実行フェーズ
// ===============================
(async () => {

    console.log("=== load modules ===");

    await loadChunk("./bloxd_chunk4.js");
    await loadChunk("./bloxd_chunk5.js");

    console.log("modules:", Object.keys(EC.m).length);

    // ===============================
    // 🔥 エントリ候補探し
    // ===============================
    const candidates = Object.entries(EC.m).filter(([id, fn]) =>
        fn.toString().includes("setup") ||
        fn.toString().includes("init") ||
        fn.toString().includes("start")
    );

    console.log("candidates:", candidates.map(([id]) => id));

    // ===============================
    // 👇 ここで1つだけ試す（重要）
    // ===============================
    const testId = candidates[0]?.[0];

    if (!testId) {
        console.warn("no candidate");
        return;
    }

    console.log("▶ executing:", testId);

    const result = EC(testId);

    console.log("result:", result);

})();
</script></body>
</html>
