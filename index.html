<h2>bloxd chunk loader (stable)</h2>
<script type="module">
(async () => {
  console.log("=== ESM LOAD ===");

  // ESMとして読み込む

  console.log("📦 module:", mod);

  if (mod.default) {
    console.log("default:", mod.default);
  }

})();
</script>
