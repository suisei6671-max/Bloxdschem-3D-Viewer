<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script type="module">

// ===============================
// 🔥 chunk読み込み（ESMとして）
// ===============================
async function loadChunk(path) {
    console.log("📦 loading:", path);

    const mod = await import(path);

    console.log("✅ keys:", Object.keys(mod));

    return mod;
}

// ===============================
(async () => {

    console.log("=== ESM MODE ===");

    const chunk5 = await loadChunk("./bloxd_chunk5.js");

    // 👇 ここが本体
    const modules = chunk5.modules;

    console.log("🎯 modules:", Object.keys(modules).length);

    // ===============================
    // require再現
    // ===============================
    const cache = {};

    function require(id) {
        if (!modules[id]) {
            console.warn("❌ missing:", id);
            return {};
        }

        if (cache[id]) return cache[id].exports;

        const module = { exports: {} };
        cache[id] = module;

        modules[id](module, module.exports, require);

        return module.exports;
    }

    // ===============================
    // 🎯 実行
    // ===============================
    const mod1929 = require(1929);

    console.log("📦 1929:", mod1929);

})();
</script>
</body>
</html>
