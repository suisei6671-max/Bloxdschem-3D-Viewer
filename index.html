<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bloxd Viewer Debug</title>
<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#1d1f27;
font-family:sans-serif;
color:#fff
}
#app{
position:relative;
width:100%;
height:100%
}
#noa-canvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
image-rendering:pixelated
}
#ui{
position:absolute;
left:12px;
top:12px;
width:430px;
max-height:calc(100% - 24px);
overflow:auto;
background:rgba(0,0,0,.8);
border-radius:16px;
padding:14px;
z-index:10;
backdrop-filter:blur(8px)
}
input,button{
width:100%;
margin-bottom:10px
}
button{
border:none;
border-radius:10px;
padding:12px;
background:#4d78ff;
color:#fff;
font-weight:bold;
cursor:pointer
}
pre{
margin:0;
padding:10px;
background:#111;
border-radius:10px;
font-size:12px;
line-height:1.4;
white-space:pre-wrap;
word-break:break-word;
max-height:340px;
overflow:auto
}
</style>
</head>
<body>

<div id="app">

<canvas id="noa-canvas"></canvas>

<div id="ui">

<input type="file" id="schemInput" accept=".bloxdschem">

<button id="buildBtn">
Build Viewer
</button>

<pre id="log"></pre>

</div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

const logEl=document.getElementById("log");

function log(...args){

console.log(...args);

logEl.textContent+=args.map(v=>{

if(typeof v==="string"){
return v;
}

try{
return JSON.stringify(v,null,2);
}catch{
return String(v);
}

}).join(" ")+"\n";

logEl.scrollTop=logEl.scrollHeight;

}

const canvas=document.getElementById("noa-canvas");

const engine=new BABYLON.Engine(
canvas,
true,
{
antialias:false,
preserveDrawingBuffer:true
}
);

const scene=new BABYLON.Scene(engine);

scene.clearColor=new BABYLON.Color4(
0.2,
0.2,
0.3,
1
);

scene.ambientColor=new BABYLON.Color3(
0.5,
0.5,
0.5
);

const camera=new BABYLON.ArcRotateCamera(
"cam",
-Math.PI/2,
1.1,
80,
new BABYLON.Vector3(16,16,16),
scene
);

camera.attachControl(canvas,true);

const hemi=new BABYLON.HemisphericLight(
"h",
new BABYLON.Vector3(0,1,0),
scene
);

hemi.intensity=1.2;

const textureData={};
const textureCache=new Map();
const materialCache=new Map();

let blockData=[];

async function extractTextures(){

log("[TEXTURE] scanning");

const res=await fetch("./76njx.4.74e4a68f.chunk.js");

const source=await res.text();

const pngRegex=/"\.\/([^"]+?)\.png":(\d+)/g;
const dataRegex=/(\d+):[^\n]*?exports\s*=\s*"([^"]+)"/g;

const pngMap=new Map();
const base64Map=new Map();

let match;

while((match=pngRegex.exec(source))!==null){

pngMap.set(
match[1],
parseInt(match[2])
);

}

while((match=dataRegex.exec(source))!==null){

const id=parseInt(match[1]);

const data=match[2];

if(data.startsWith("data:image")){

base64Map.set(id,data);

}

}

pngMap.forEach((id,name)=>{

const data=base64Map.get(id);

if(data){

textureData[name]=data;

}

});

log("[TEXTURE DONE]",Object.keys(textureData).length);

}

async function loadBlockData(){

const res=await fetch("./blockData.json");

blockData=await res.json();

log("[BLOCK DATA]",blockData.length);

}

function getTexture(name){

if(textureCache.has(name)){
return textureCache.get(name);
}

const data=textureData[name];

if(!data){

log("[MISSING TEXTURE]",name);

return null;

}

const tex=new BABYLON.Texture(
data,
scene,
false,
false,
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

tex.updateSamplingMode(
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

textureCache.set(name,tex);

return tex;

}

function getMaterial(name){

if(materialCache.has(name)){
return materialCache.get(name);
}

const mat=new BABYLON.StandardMaterial(
name,
scene
);

mat.specularColor=BABYLON.Color3.Black();

mat.ambientColor=new BABYLON.Color3(
1,
1,
1
);

mat.diffuseTexture=getTexture(name);

materialCache.set(name,mat);

return mat;

}

function readULEB128(bytes,offset){

let result=0;
let shift=0;
let pos=offset;

while(true){

const byte=bytes[pos];

result|=(byte&127)<<shift;

pos++;

if((byte&128)===0){
break;
}

shift+=7;

}

return{
value:result,
offset:pos
};

}

function decodeChunkBlocks(bytes){

const result=[];

let offset=0;

while(offset<bytes.length){

const countData=readULEB128(bytes,offset);

offset=countData.offset;

const idData=readULEB128(bytes,offset);

offset=idData.offset;

for(let i=0;i<countData.value;i++){

result.push(idData.value);

}

}

return result;

}

function indexToXYZ(index,sizeX,sizeY,sizeZ){

const x=index%sizeX;

const y=Math.floor(index/sizeX)%sizeY;

const z=Math.floor(
index/(sizeX*sizeY)
);

return{
x,
y,
z
};

}

async function loadSchem(file){

const buffer=await file.arrayBuffer();

const bytes=new Uint8Array(buffer);

let offset=4;

function readVarInt(){

let shift=0;
let result=0;

while(true){

const b=bytes[offset++];

result|=(b&127)<<shift;

if(!(b&128)){
break;
}

shift+=7;

}

return(result>>>1)^-(result&1);

}

function readString(){

const len=readVarInt();

const slice=bytes.slice(
offset,
offset+len
);

offset+=len;

return new TextDecoder().decode(slice);

}

function readBytes(){

const len=readVarInt();

const slice=bytes.slice(
offset,
offset+len
);

offset+=len;

return slice;

}

const schem={};

schem.name=readString();

schem.x=readVarInt();
schem.y=readVarInt();
schem.z=readVarInt();

schem.sizeX=readVarInt();
schem.sizeY=readVarInt();
schem.sizeZ=readVarInt();

schem.chunks=[];

while(offset<bytes.length){

const chunkCount=readVarInt();

if(chunkCount<=0){
break;
}

for(let i=0;i<chunkCount;i++){

const chunk={};

chunk.x=readVarInt();
chunk.y=readVarInt();
chunk.z=readVarInt();

chunk.blocks=readBytes();

schem.chunks.push(chunk);

}

}

log("[SCHEM]",{
name:schem.name,
sizeX:schem.sizeX,
sizeY:schem.sizeY,
sizeZ:schem.sizeZ,
chunks:schem.chunks.length
});

return schem;

}

function clearWorld(){

const meshes=scene.meshes.slice();

for(const mesh of meshes){

if(mesh.name!=="debug_keep"){

mesh.dispose();

}

}

}

function buildSchem(schem){

clearWorld();

let rendered=0;

for(const chunk of schem.chunks){

const decoded=decodeChunkBlocks(
new Uint8Array(chunk.blocks)
);

log(
"[CHUNK]",
chunk.x,
chunk.y,
chunk.z,
decoded.length
);

for(let i=0;i<decoded.length;i++){

const id=decoded[i];

if(id===0){
continue;
}

const pos=indexToXYZ(
i,
32,
32,
32
);

const worldX=chunk.x*32+pos.x;
const worldY=chunk.y*32+pos.y;
const worldZ=chunk.z*32+pos.z;

const block=blockData[id];

if(!block){
continue;
}

const box=BABYLON.MeshBuilder.CreateBox(
"block",
{
size:1
},
scene
);

box.position.set(
worldX,
worldY,
worldZ
);

if(typeof block.textureInfo==="string"){

box.material=getMaterial(
block.textureInfo
);

}else if(Array.isArray(block.textureInfo)){

const texName=
block.textureInfo[0];

box.material=getMaterial(
texName
);

}

rendered++;

if(rendered<20){

log(
"[BLOCK]",
id,
block.name,
worldX,
worldY,
worldZ
);

}

}

}

log("[DONE]",rendered);

camera.target=new BABYLON.Vector3(
16,
16,
16
);

camera.radius=80;

}

document.getElementById(
"buildBtn"
).onclick=async()=>{

try{

log("====================");

await extractTextures();

await loadBlockData();

const file=
document.getElementById(
"schemInput"
).files[0];

if(!file){

alert("schem選んで！");
return;

}

const schem=
await loadSchem(file);

buildSchem(schem);

}catch(err){

console.error(err);

log("[ERROR]",err.message);

}

};

engine.runRenderLoop(()=>{

scene.render();

});

window.addEventListener(
"resize",
()=>engine.resize()
);

log("[READY]");

</script>
</body>
</html>
