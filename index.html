<h2>bloxd chunk loader (stable)</h2>
<script type="module">
(async () => {
  console.log("=== FULL MERGE MODE ===");

  const chunks = [
    "./bloxd_chunk4.js",
    "./bloxd_chunk5.js",
    "./bloxd_chunk6.js",
    "./bloxd_chunk7.js"
  ];

  const allModules = {};

  for (const path of chunks) {
    const mod = await import(path);
    Object.assign(allModules, mod.modules);
  }

  console.log("📦 TOTAL modules:", Object.keys(allModules).length);

  const cache = {};

  function require(id) {
    if (cache[id]) return cache[id].exports;

    if (!allModules[id]) {
      console.warn("❌ missing:", id);
      return {};
    }

    const module = { exports: {} };
    cache[id] = module;

    allModules[id](module, module.exports, require);

    return module.exports;
  }

  // webpack helpers
  require.d = (exports, definition) => {
    for (const key in definition) {
      Object.defineProperty(exports, key, {
        enumerable: true,
        get: definition[key],
      });
    }
  };

  require.r = (exports) => {
    Object.defineProperty(exports, '__esModule', { value: true });
  };

  require.n = (module) => {
    const getter = module && module.__esModule
      ? () => module.default
      : () => module;
    require.d(getter, { a: getter });
    return getter;
  };

  require.o = (obj, prop) => Object.prototype.hasOwnProperty.call(obj, prop);

  // global expose
  window.__req = require;

  console.log("🔥 READY");

  // 🎯 テスト
  const m1929 = require(1929);
  console.log("🎯 1929:", m1929);

})();
</script>
