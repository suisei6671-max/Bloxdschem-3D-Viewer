<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script>
(async () => {

  console.log("=== SAFE MODULE EXTRACT ===");

  async function extractModules(path) {

    console.log("📦 loading:", path);

    const text = await fetch(path).then(r => r.text());

    console.log("🧪 preview:", text.slice(0, 120));

    // modules: { ... }
    const match = text.match(/modules\s*:\s*\{([\s\S]*?)\}\s*\}/);

    if (!match) {
      console.error("❌ modules not found");
      return {};
    }

    const objText = "({" + match[1] + "})";

    console.log("🧠 parsing modules...");

    const modules = new Function("return " + objText)();

    console.log("✅ extracted:", Object.keys(modules).length);

    return modules;
  }

  const allModules = {
    ...(await extractModules("./bloxd_chunk4.js")),
    ...(await extractModules("./bloxd_chunk5.js")),
    ...(await extractModules("./bloxd_chunk6.js")),
    ...(await extractModules("./bloxd_chunk7.js")),
  };

  console.log("🎯 TOTAL:", Object.keys(allModules).length);

  window.__mods = allModules;

})();
</script>
</body>
</html>
