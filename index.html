<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bloxd Viewer</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#1d1f27;
font-family:sans-serif;
color:white;
}

#renderCanvas{
width:100%;
height:100%;
display:block;
image-rendering:pixelated;
}

#ui{
position:fixed;
left:10px;
top:10px;
width:560px;
max-height:95vh;
overflow:auto;
background:rgba(0,0,0,.9);
padding:14px;
border-radius:14px;
z-index:10;
}

button,input{
width:100%;
margin-bottom:10px;
}

button{
border:none;
padding:12px;
border-radius:10px;
background:#4d78ff;
color:white;
font-weight:bold;
cursor:pointer;
}

pre{
margin:0;
padding:10px;
background:#111;
border-radius:10px;
font-size:12px;
white-space:pre-wrap;
word-break:break-word;
max-height:420px;
overflow:auto;
}
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="ui">

<div style="font-size:24px;font-weight:bold;margin-bottom:8px">
Bloxd Viewer
</div>

<div style="opacity:.7;margin-bottom:12px">
fixed ids + correct rotations
</div>

<input type="file" id="schemInput" accept=".bloxdschem">

<button id="buildBtn">
BUILD
</button>

<pre id="log"></pre>

</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

async function buildSchem(schem){

clearScene();

let placed=0;

for(const chunk of schem.chunks){

log(
"[CHUNK]",
chunk.x,
chunk.y,
chunk.z,
chunk.blocks.length
);

const decoded=decodeBlocks(
new Uint8Array(chunk.blocks)
);

for(let i=0;i<decoded.length;i++){

const rawId=decoded[i];

if(rawId===0)continue;

/*
schem:
0 air
1 unloaded
2 dirt
*/

const blockId=rawId-1;

const block=blockMap[blockId];

if(!block){

log(
"[MISSING BLOCK]",
rawId,
"->",
blockId
);

continue;

}

const pos=idxToXYZ(i);

log(
"[PLACE]",
rawId,
"->",
blockId,
block.name
);

await buildBlock(
block,
chunk.z*32+pos.z,
chunk.y*32+pos.y,
chunk.x*32+pos.x
);

placed++;

}

}

log("[DONE]",placed);

}

async function buildBlock(block,x,y,z){

const mesh=BABYLON.MeshBuilder.CreateBox(
"block",
{
size:1,
wrap:true
},
scene
);

mesh.position.set(x,y,z);

if(typeof block.textureInfo==="string"){

mesh.material=await createMaterial(
block.textureInfo,
0
);

return;

}

const multi=new BABYLON.MultiMaterial(
"multi",
scene
);

/*
Babylon faces:
0 front
1 back
2 right
3 left
4 top
5 bottom

Bloxd:
[left,right,top,bottom,front,back]
*/

const faceMap=[
4,
5,
1,
0,
2,
3
];

/*
修正版

front/back/top/bottom
左90°
*/

const rotationMap={
0:-90,
1:-90,
2:0,
3:0,
4:-90,
5:-90
};

for(let face=0;face<6;face++){

const bloxdFace=faceMap[face];

const texIndex=
block.texturePerSide?.[
bloxdFace
] ?? 0;

const texName=
block.textureInfo[
texIndex
];

const rot=
rotationMap[face] ?? 0;

log(
"[FACE]",
face,
texName,
rot
);

const mat=
await createMaterial(
texName,
rot
);

multi.subMaterials.push(mat);

}

mesh.material=multi;

const vc=mesh.getTotalVertices();

mesh.subMeshes=[];

let idx=0;

for(let i=0;i<6;i++){

mesh.subMeshes.push(
new BABYLON.SubMesh(
i,
0,
vc,
idx,
6,
mesh
)
);

idx+=6;

}

}

</script>
</body>
</html>
