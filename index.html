<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>bloxd loader stable</title>
</head>
<body>

<h2>bloxd chunk loader (stable)</h2>
<script type="module">

async function loadChunk(path) {
    const mod = await import(path);
    return mod.modules;
}

(async () => {

    console.log("=== BLOCK METADATA HUNT ===");

    const modules = await loadChunk("./bloxd_chunk5.js");

    const cache = {};

    function EC(id) {
        if (!modules[id]) {
            console.warn("❌ missing:", id);
            return {};
        }

        if (cache[id]) return cache[id].exports;

        const module = { exports: {} };
        cache[id] = module;

        modules[id](module, module.exports, EC);

        return module.exports;
    }

    EC.d = function(exports, definition) {
        for (const key in definition) {
            Object.defineProperty(exports, key, {
                enumerable: true,
                get: definition[key]
            });
        }
    };

    EC.o = (obj, prop) => Object.prototype.hasOwnProperty.call(obj, prop);
    EC.r = (exports) => Object.defineProperty(exports, '__esModule', { value: true });

    // ===============================
    // 🔥 1929 実行
    // ===============================
    const mod = EC(1929);

    console.log("📦 module keys:", Object.keys(mod));

    // ===============================
    // 🔥 getterを全部実行
    // ===============================
    for (const key of Object.keys(mod)) {
        try {
            const value = mod[key];

            console.log("🔍", key, value);

            // 🎯 blockMetadataっぽいもの検出
            if (
                value &&
                typeof value === "object" &&
                !Array.isArray(value) &&
                Object.keys(value).length > 50
            ) {
                console.log("🎯 FOUND CANDIDATE:", key, value);
            }

        } catch (e) {
            console.warn("⚠ getter error:", key);
        }
    }

})();
</script>
</body>
</html>
