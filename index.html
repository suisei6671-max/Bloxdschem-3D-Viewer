<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bloxd Schem Viewer</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#1b1d24;
font-family:sans-serif;
color:white;
}

#renderCanvas{
width:100%;
height:100%;
display:block;
image-rendering:pixelated;
}

#ui{
position:fixed;
left:10px;
top:10px;
width:420px;
max-height:95vh;
overflow:auto;
background:rgba(0,0,0,.88);
padding:14px;
border-radius:14px;
z-index:100;
backdrop-filter:blur(8px);
}

.title{
font-size:24px;
font-weight:bold;
margin-bottom:4px;
}

.ver{
font-size:13px;
opacity:.7;
margin-bottom:12px;
}

button,input{
width:100%;
margin-bottom:10px;
}

button{
border:none;
background:#4d7cff;
padding:12px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#6690ff;
}

pre{
background:#111;
padding:10px;
border-radius:10px;
font-size:12px;
white-space:pre-wrap;
word-break:break-word;
max-height:420px;
overflow:auto;
}

</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="ui">

<div class="title">
Bloxd Schem Viewer
</div>

<div class="ver">
ver alpha-0.13
</div>

<input
type="file"
id="schemInput"
accept=".bloxdschem"
>

<button id="buildBtn">
BUILD
</button>

<pre id="log"></pre>

</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

const VERSION="alpha-0.14";

const logEl=document.getElementById("log");

function log(...a){

console.log(...a);

logEl.textContent+=a.map(v=>{

if(typeof v==="string") return v;

try{
return JSON.stringify(v,null,2);
}catch{
return String(v);
}

}).join(" ")+"\n";

logEl.scrollTop=logEl.scrollHeight;

}

log("[BOOT]",VERSION);

const canvas=document.getElementById("renderCanvas");

const engine=new BABYLON.Engine(
canvas,
true,
{
antialias:false,
preserveDrawingBuffer:true
}
);

const scene=new BABYLON.Scene(engine);

scene.clearColor=
new BABYLON.Color4(
0.15,
0.16,
0.2,
1
);

const camera=
new BABYLON.ArcRotateCamera(
"cam",
-Math.PI/2,
1.2,
40,
new BABYLON.Vector3(0,0,0),
scene
);

camera.attachControl(canvas,true);

const light=
new BABYLON.HemisphericLight(
"light",
new BABYLON.Vector3(0,1,0),
scene
);

light.intensity=2;

const textureData={};

const textureCache=
new Map();

let blockMap={};

/*
Babylon faces

0 front
1 back
2 right
3 left
4 top
5 bottom
*/

const FACE_ROTATION={

0:90,
1:90,

2:90,
3:90,

4:-90,
5:-90

};

/*
Bloxd:
[left,right,top,bottom,front,back]
*/

const FACE_MAP=[
4,
5,
1,
0,
2,
3
];

async function extractTextures(){

log("[TEXTURE] scanning");

const res=
await fetch(
"./76njx.4.74e4a68f.chunk.js"
);

const src=
await res.text();

log(
"[TEXTURE] source size",
src.length
);

const pngRegex=
/"\.\/([^"]+?)\.png":(\d+)/g;

const dataRegex=
/(\d+):[^\n]*?exports\s*=\s*"([^"]+)"/g;

const pngMap=
new Map();

const base64Map=
new Map();

let m;

while(
(m=pngRegex.exec(src))!==null
){

pngMap.set(
m[1],
parseInt(m[2])
);

}

while(
(m=dataRegex.exec(src))!==null
){

const id=
parseInt(m[1]);

const data=m[2];

if(
data.startsWith("data:image")
){

base64Map.set(
id,
data
);

}

}

pngMap.forEach((id,name)=>{

const data=
base64Map.get(id);

if(data){

textureData[name]=data;

}

});

log(
"[TEXTURES]",
Object.keys(textureData).length
);

}

async function loadBlockData(){

const res=
await fetch("./blockData.json");

const json=
await res.json();

blockMap={};

for(
let i=0;
i<json.length;
i++
){

blockMap[i]=json[i];

}

log(
"[BLOCKS]",
Object.keys(blockMap).length
);

}

function getTexture(name){

if(
textureCache.has(name)
){

return textureCache.get(name);

}

const data=
textureData[name];

if(!data){

log(
"[MISSING TEXTURE]",
name
);

return null;

}

const tex=
new BABYLON.Texture(
data,
scene,
false,
false,
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

tex.updateSamplingMode(
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

textureCache.set(
name,
tex
);

return tex;

}

async function createRotatedTexture(
name,
deg
){

const key=
`${name}_rot_${deg}_${Math.random()}`;

const src=
textureData[name];

if(!src){

return getTexture(name);

}

return new Promise(resolve=>{

const img=new Image();

img.src=src;

img.onload=()=>{

const c=
document.createElement("canvas");

c.width=16;
c.height=16;

const ctx=
c.getContext("2d");

ctx.imageSmoothingEnabled=false;

ctx.translate(8,8);

ctx.rotate(
deg*Math.PI/180
);

ctx.drawImage(
img,
-8,
-8,
16,
16
);

const tex=
new BABYLON.DynamicTexture(
key,
{
width:16,
height:16
},
scene,
false,
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

const tctx=
tex.getContext();

tctx.imageSmoothingEnabled=false;

tctx.clearRect(0,0,16,16);

tctx.drawImage(c,0,0);

tex.update();

tex.updateSamplingMode(
BABYLON.Texture.NEAREST_SAMPLINGMODE
);

resolve(tex);

};

});

}

function clearScene(){

scene.meshes
.slice()
.forEach(m=>m.dispose());

}

function readULEB(bytes,state){

let result=0;
let shift=0;

while(true){

const byte=
bytes[state.offset++];

result|=
(byte&127)<<shift;

if((byte&128)===0)
break;

shift+=7;

}

return result;

}

function decodeBlocks(bytes){

const arr=
new Uint16Array(32*32*32);

const state={
offset:0
};

while(
state.offset<bytes.length
){

const index=
readULEB(bytes,state);

if(
state.offset>=bytes.length
) break;

const id=
readULEB(bytes,state);

if(index<arr.length){

arr[index]=id;

}

}

return arr;

}

function idxToXYZ(i){

return{

x:i%32,

y:
Math.floor(i/32)%32,

z:
Math.floor(i/1024)

};

}

async function parseSchem(file){

const buf=
await file.arrayBuffer();

const bytes=
new Uint8Array(buf);

let offset=4;

function readVarInt(){

let shift=0;
let result=0;

while(true){

const b=
bytes[offset++];

result|=
(b&127)<<shift;

if(!(b&128))
break;

shift+=7;

}

return(
(result>>>1)
^-(result&1)
);

}

function readString(){

const len=
readVarInt();

const slice=
bytes.slice(
offset,
offset+len
);

offset+=len;

return new TextDecoder()
.decode(slice);

}

function readBytes(){

const len=
readVarInt();

const slice=
bytes.slice(
offset,
offset+len
);

offset+=len;

return slice;

}

const schem={};

schem.name=
readString();

schem.x=readVarInt();
schem.y=readVarInt();
schem.z=readVarInt();

schem.sizeX=readVarInt();
schem.sizeY=readVarInt();
schem.sizeZ=readVarInt();

schem.chunks=[];

while(offset<bytes.length){

const count=
readVarInt();

if(count<=0)
break;

for(
let i=0;
i<count;
i++
){

schem.chunks.push({

x:readVarInt(),
y:readVarInt(),
z:readVarInt(),

blocks:readBytes()

});

}

}

log(
"[SCHEM HEADER]",
schem
);

log(
"[CHUNKS]",
schem.chunks.length
);

return schem;

}

async function buildBlock(
block,
x,
y,
z
){

const mesh=
BABYLON.MeshBuilder.CreateBox(
"block",
{
size:1
},
scene
);

mesh.position.set(x,y,z);

/*
単一テクスチャ
*/

if(
typeof block.textureInfo==="string"
){

const mat=
new BABYLON.StandardMaterial(
"single",
scene
);

mat.diffuseTexture=
getTexture(
block.textureInfo
);

mat.specularColor=
BABYLON.Color3.Black();

mat.emissiveColor=
new BABYLON.Color3(1,1,1);

mat.disableLighting=true;

mesh.material=mat;

return;

}

const multi=
new BABYLON.MultiMaterial(
"multi",
scene
);

for(
let face=0;
face<6;
face++
){

const bloxdFace=
FACE_MAP[face];

const texIndex=
block.texturePerSide?.[
bloxdFace
] ?? 0;

const texName=
block.textureInfo[
texIndex
];

const rot=
FACE_ROTATION[
face
] ?? 0;

log(
"[FACE]",
face,
texName,
"ROT",
rot
);

let tex;

if(rot!==0){

tex=
await createRotatedTexture(
texName,
rot
);

}else{

tex=getTexture(texName);

}

const mat=
new BABYLON.StandardMaterial(
texName+"_"+
face+
"_"+
Math.random(),
scene
);

mat.diffuseTexture=tex;

mat.specularColor=
BABYLON.Color3.Black();

mat.emissiveColor=
new BABYLON.Color3(1,1,1);

mat.disableLighting=true;

multi.subMaterials.push(mat);

}

mesh.material=multi;

const verticesCount=
mesh.getTotalVertices();

mesh.subMeshes=[];

let indexStart=0;

for(let i=0;i<6;i++){

mesh.subMeshes.push(

new BABYLON.SubMesh(
i,
0,
verticesCount,
indexStart,
6,
mesh
)

);

indexStart+=6;

}

}

async function buildSchem(
schem
){

clearScene();

let placed=0;

for(
const chunk of schem.chunks
){

log(
"[CHUNK]",
chunk.x,
chunk.y,
chunk.z,
chunk.blocks.length
);

const decoded=
decodeBlocks(
new Uint8Array(
chunk.blocks
)
);

for(
let i=0;
i<decoded.length;
i++
){

const rawId=
decoded[i];

if(rawId===0)
continue;

/*
0 air
1 unloaded
2 dirt
*/

const blockId=
rawId-1;

const block=
blockMap[blockId];

if(!block){

log(
"[MISSING BLOCK]",
rawId,
"->",
blockId
);

continue;

}

const pos=
idxToXYZ(i);

await buildBlock(

block,

chunk.z*32+pos.z,
chunk.y*32+pos.y,
chunk.x*32+pos.x

);

placed++;

}

}

log(
"[DONE]",
placed
);

}

document
.getElementById("buildBtn")
.onclick=async()=>{

try{

textureCache.clear();

await extractTextures();

await loadBlockData();

const file=
document
.getElementById("schemInput")
.files[0];

if(!file){

alert("schem選択");

return;

}

const schem=
await parseSchem(file);

log(
"[SCHEM]",
schem.name
);

await buildSchem(schem);

}catch(e){

console.error(e);

log(
"[ERROR]",
e.message
);

}

};

engine.runRenderLoop(()=>{

scene.render();

});

window.addEventListener(
"resize",
()=>engine.resize()
);

log("[READY]");

</script>

</body>
</html>
